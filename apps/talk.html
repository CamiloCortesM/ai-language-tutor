<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor — Talk</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-family: var(--font-display); font-size: 17px; }
  .brand span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
  .end-btn { border: none; background: var(--surface-2); color: var(--ink-soft); font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer; }
  .end-btn:hover { filter: brightness(.96); }
  main { flex: 1; width: 100%; max-width: 620px; margin: 0 auto; padding: 20px 16px 170px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); font-size: 17px; line-height: 1.5; animation: tut-rise .2s var(--ease); }
  .tutor { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow-1); }
  .you { align-self: flex-end; background: var(--accent-soft); color: var(--accent-strong); font-weight: 500; }
  .interim { opacity: .55; font-style: italic; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); box-shadow: var(--shadow-2); padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); z-index: 10; }
  .foot { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .status { font-size: 13px; font-weight: 600; color: var(--ink-faint); min-height: 18px; }
  .mic { border: none; width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 30px; cursor: pointer; box-shadow: var(--shadow-2); transition: transform .15s var(--ease), background .2s; }
  .mic:hover { filter: brightness(1.06); }
  .mic.listening { background: var(--error); animation: pulse 1.2s infinite; }
  .mic:disabled { background: var(--surface-2); color: var(--ink-faint); cursor: default; animation: none; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .typebox { display: none; width: 100%; gap: 8px; }
  .typebox input { flex: 1; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: var(--ink); }
  .typebox button { border: none; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 12px 18px; border-radius: var(--radius-sm); cursor: pointer; }
  .notice { font-size: 13px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column">
<header>
  <div class="brand"><b>Tutor</b><span>Talk 🎙️</span></div>
  <button class="end-btn" id="end">End session</button>
</header>
<main id="log"></main>
<footer>
  <div class="foot">
    <div class="status" id="status">connecting to your tutor…</div>
    <button class="mic" id="mic" aria-label="Hold or tap to talk" disabled>🎙️</button>
    <div class="typebox" id="typebox">
      <input id="typed" placeholder="Type your answer (no mic available)…" aria-label="Your answer">
      <button id="send">Send</button>
    </div>
  </div>
</footer>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const LANG = params.get('lang') || 'en-GB';
  let turn = 0, busy = false, listening = false, ended = false;
  const $ = id => document.getElementById(id);
  const log = $('log'), mic = $('mic'), status = $('status');

  function bubble(cls, text) {
    const d = document.createElement('div');
    d.className = 'bubble ' + cls;
    d.textContent = text;
    log.appendChild(d);
    d.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return d;
  }

  let premiumTTS = true;
  function speak(text) {
    return new Promise(async resolve => {
      if (premiumTTS) {
        try {
          const r = await fetch('/api/tts?text=' + encodeURIComponent(text));
          if (r.status === 200) {
            const a = new Audio(URL.createObjectURL(await r.blob()));
            a.onended = resolve; a.onerror = resolve;
            a.play().catch(resolve);
            return;
          }
          if (r.status === 204) premiumTTS = false;
        } catch (e) { premiumTTS = false; }
      }
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = LANG; u.rate = 0.95; u.onend = resolve;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch (e) { resolve(); }
    });
  }

  async function waitReply(expect) {
    while (!ended) {
      try {
        const r = await fetch('/api/talk');
        if (r.ok) {
          const d = await r.json();
          if (d.turn === expect && d.reply) return d;
        }
      } catch (e) {}
      await new Promise(res => setTimeout(res, 1200));
    }
  }

  async function tutorTurn(expect) {
    busy = true; mic.disabled = true;
    status.textContent = 'tutor is thinking…';
    const d = await waitReply(expect);
    if (!d) return;
    bubble('tutor', d.reply);
    status.textContent = 'tutor is speaking…';
    await speak(d.reply);
    if (d.end) { finish('Session ended — your corrections are waiting in the tutor chat.'); return; }
    busy = false; mic.disabled = false;
    status.textContent = 'your turn — tap the mic and speak';
  }

  async function userSaid(text) {
    if (!text.trim() || busy) return;
    bubble('you', text);
    turn++;
    try {
      await fetch('/api/talk', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turn, transcript: text }) });
    } catch (e) {}
    tutorTurn(turn);
  }

  function finish(msg) {
    ended = true; busy = true;
    mic.disabled = true; $('typebox').style.display = 'none';
    status.textContent = '';
    const n = document.createElement('div');
    n.className = 'notice'; n.textContent = msg;
    log.appendChild(n);
  }

  // --- speech recognition (Chrome/Edge; typing fallback elsewhere) ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, interimBubble = null;
  if (SR) {
    rec = new SR();
    rec.lang = LANG; rec.interimResults = true; rec.continuous = false;
    rec.onresult = e => {
      let interim = '', final = '';
      for (const res of e.results) (res.isFinal ? final += res[0].transcript : interim += res[0].transcript);
      if (interim) {
        if (!interimBubble) interimBubble = bubble('you interim', '');
        interimBubble.textContent = interim;
      }
      if (final) {
        if (interimBubble) { interimBubble.remove(); interimBubble = null; }
        stopListening();
        userSaid(final);
      }
    };
    rec.onend = () => { if (listening) stopListening(); };
    rec.onerror = () => stopListening();
  } else {
    mic.style.display = 'none';
    $('typebox').style.display = 'flex';
  }

  function stopListening() {
    listening = false; mic.classList.remove('listening');
    if (interimBubble) { interimBubble.remove(); interimBubble = null; }
    try { rec && rec.stop(); } catch (e) {}
    if (!busy) status.textContent = 'your turn — tap the mic and speak';
  }

  mic.addEventListener('click', () => {
    if (busy) return;
    if (listening) return stopListening();
    listening = true; mic.classList.add('listening');
    status.textContent = 'listening… speak now';
    try { rec.start(); } catch (e) {}
  });
  $('send').addEventListener('click', () => { userSaid($('typed').value); $('typed').value = ''; });
  $('typed').addEventListener('keydown', e => { if (e.key === 'Enter') { userSaid($('typed').value); $('typed').value = ''; } });
  $('end').addEventListener('click', async () => {
    turn++;
    try {
      await fetch('/api/talk', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ turn, end: true }) });
    } catch (e) {}
    finish('Session ended — your corrections are waiting in the tutor chat.');
  });

  // opening turn: the tutor writes reply 0 before opening this page
  tutorTurn(0);
})();
</script>
</body>
</html>
